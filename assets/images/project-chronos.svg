      <rect x="26" y="70" width="80" height="20" rx="10" fill="#1A3826"/>
      <text x="34" y="84" font-family="Space Mono, monospace" font-size="9" fill="#22C55E">#DEPLOY-90</text>
      <text x="26" y="112" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="700" fill="#FFF9EE">Edge Cache Invalidation</text>
