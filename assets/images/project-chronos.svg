  <!-- Left Sidebar inside App -->
  <g transform="translate(40, 95)">
    <rect x="0" y="0" width="220" height="615" rx="18" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
    
    <!-- User Workspace -->
