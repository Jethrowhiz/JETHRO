    <text x="40" y="155" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="500" fill="#FFF9EE" opacity="0.7">Backlog &amp; Roadmaps</text>
    <text x="40" y="195" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="500" fill="#FFF9EE" opacity="0.7">API Integrations</text>
    <text x="40" y="235" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="500" fill="#FFF9EE" opacity="0.7">Team Analytics</text>
    <text x="40" y="275" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="500" fill="#FFF9EE" opacity="0.7">Settings</text>
