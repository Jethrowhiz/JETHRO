      <rect x="14" y="55" width="247" height="135" rx="12" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <rect x="26" y="70" width="60" height="20" rx="10" fill="#54230F"/>
      <text x="34" y="84" font-family="Space Mono, monospace" font-size="9" fill="#E8A65D">#ENG-102</text>
      <text x="26" y="112" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="700" fill="#FFF9EE">Migrate Zustand store to v5</text>
      <text x="26" y="130" font-family="Plus Jakarta Sans, sans-serif" font-size="11" fill="#FFF9EE" opacity="0.6">State machine optimizations</text>
      <circle cx="230" cy="160" r="10" fill="#C47A3E"/>

      <!-- Task Card 2 -->
      <rect x="14" y="205" width="247" height="135" rx="12" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <rect x="26" y="220" width="60" height="20" rx="10" fill="#713315"/>
      <text x="34" y="234" font-family="Space Mono, monospace" font-size="9" fill="#FFF9EE">#A11Y-88</text>
      <text x="26" y="262" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="700" fill="#FFF9EE">Audit keyboard focus traps</text>
      <text x="26" y="280" font-family="Plus Jakarta Sans, sans-serif" font-size="11" fill="#FFF9EE" opacity="0.6">WCAG 2.2 focus visible compliance</text>
      <circle cx="230" cy="310" r="10" fill="#E8A65D"/>
