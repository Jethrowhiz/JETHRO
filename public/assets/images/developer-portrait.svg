<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradients -->
    <radialGradient id="bgGlow" cx="65%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#E8A65D" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#C47A3E" stop-opacity="0.75"/>
      <stop offset="65%" stop-color="#713315" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#54230F" stop-opacity="1"/>
    </radialGradient>

    <!-- Warm Amber Key Light -->
    <radialGradient id="keyLight" cx="75%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#FFF9EE" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#E8A65D" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#C47A3E" stop-opacity="0"/>
    </radialGradient>

    <!-- Silhouette & Shading Gradients -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C47A3E"/>
      <stop offset="45%" stop-color="#713315"/>
      <stop offset="100%" stop-color="#3D1708"/>
    </linearGradient>

    <linearGradient id="faceGrad" x1="30%" y1="20%" x2="90%" y2="80%">
      <stop offset="0%" stop-color="#F6EBD6"/>
      <stop offset="35%" stop-color="#E8A65D"/>
      <stop offset="70%" stop-color="#C47A3E"/>
      <stop offset="100%" stop-color="#54230F"/>
    </linearGradient>

    <linearGradient id="headphoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2C1207"/>
      <stop offset="50%" stop-color="#171310"/>
      <stop offset="100%" stop-color="#453A33"/>
    </linearGradient>

    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25"/>
    </filter>
  </defs>

  <!-- Deep Warm Gradient Background -->
  <rect width="800" height="1000" fill="url(#bgGlow)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="620" cy="300" r="280" fill="url(#keyLight)"/>
  <circle cx="200" cy="700" r="240" fill="#713315" opacity="0.4" filter="url(#softBlur)"/>

  <!-- Architectural Background Grid Lines -->
  <g stroke="#E8A65D" stroke-opacity="0.12" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="1000"/>
    <line x1="300" y1="0" x2="300" y2="1000"/>
    <line x1="500" y1="0" x2="500" y2="1000"/>
    <line x1="700" y1="0" x2="700" y2="1000"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
    <line x1="0" y1="750" x2="800" y2="750"/>
  </g>

  <!-- Developer Silhouette / Character in Warm Lighting -->
  <!-- Shoulders & Knit Sweater / Turtleneck -->
  <path d="M 120 1000 C 150 780, 260 700, 420 680 C 580 700, 690 780, 720 1000 Z" fill="url(#bodyGrad)"/>
  
  <!-- Turtleneck Collar with ribbed texture lines -->
  <path d="M 330 680 C 330 630, 470 630, 470 680 C 470 705, 330 705, 330 680 Z" fill="#3D1708"/>
  <g stroke="#C47A3E" stroke-opacity="0.25" stroke-width="1.5">
    <line x1="350" y1="645" x2="350" y2="695"/>
    <line x1="375" y1="640" x2="375" y2="700"/>
    <line x1="400" y1="638" x2="400" y2="702"/>
    <line x1="425" y1="640" x2="425" y2="700"/>
    <line x1="450" y1="645" x2="450" y2="695"/>
  </g>

  <!-- Neck -->
  <path d="M 355 640 L 355 520 C 390 545, 430 545, 455 520 L 455 640 Z" fill="#C47A3E"/>
  <!-- Neck shadow -->
  <path d="M 355 530 C 380 570, 430 570, 455 530 L 455 580 C 410 600, 370 590, 355 580 Z" fill="#713315" opacity="0.6"/>

  <!-- Head & Jaw (Profile slightly tilted up toward the golden light, just like the reference!) -->
  <path d="M 340 370 C 330 450, 360 540, 430 550 C 490 550, 520 480, 520 400 C 520 300, 450 250, 380 270 C 340 290, 345 330, 340 370 Z" fill="url(#faceGrad)"/>

  <!-- Nose & Chin Profile in Light -->
  <path d="M 430 350 L 470 410 L 440 430 L 455 480 L 420 515" fill="none" stroke="#FFF9EE" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Closed Eye with Serene Focus (Matching the reference photo!) -->
  <path d="M 425 385 C 440 395, 455 390, 465 380" fill="none" stroke="#54230F" stroke-width="3" stroke-linecap="round"/>
  <!-- Gentle Smile -->
  <path d="M 435 465 C 450 472, 465 470, 475 460" fill="none" stroke="#54230F" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Hair / Curls with warm highlights -->
  <path d="M 330 350 C 310 300, 330 220, 390 190 C 460 160, 530 190, 560 250 C 580 300, 570 380, 530 420 C 520 360, 510 310, 470 280 C 420 250, 350 280, 330 350 Z" fill="#2C1207"/>
  <!-- Curly hair strands / texture in golden light -->
  <g stroke="#E8A65D" stroke-opacity="0.5" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M 370 210 C 390 195, 420 200, 435 220"/>
    <path d="M 430 185 C 460 175, 490 190, 500 215"/>
    <path d="M 480 200 C 510 205, 535 230, 535 255"/>
    <path d="M 525 240 C 550 260, 560 290, 550 320"/>
    <path d="M 345 250 C 360 230, 385 235, 395 255"/>
  </g>

  <!-- Over-Ear Studio Headphones (Exactly like reference!) -->
  <!-- Ear cup on right ear -->
  <ellipse cx="505" cy="415" rx="35" ry="50" transform="rotate(15 505 415)" fill="url(#headphoneGrad)" stroke="#E8A65D" stroke-opacity="0.3" stroke-width="2"/>
  <!-- Headband curving over top of hair -->
  <path d="M 360 310 C 380 220, 470 210, 510 370" fill="none" stroke="#171310" stroke-width="18" stroke-linecap="round"/>
  <path d="M 360 310 C 380 220, 470 210, 510 370" fill="none" stroke="#E8A65D" stroke-width="2" stroke-linecap="round" stroke-opacity="0.5"/>

  <!-- Warm Rim Light around developer -->
  <path d="M 420 680 C 580 700, 690 780, 720 1000" fill="none" stroke="#E8A65D" stroke-width="5" opacity="0.4" filter="url(#softBlur)"/>
  <path d="M 520 400 C 520 300, 450 250, 380 270" fill="none" stroke="#FFF9EE" stroke-width="4" opacity="0.35"/>

  <!-- Code Glyphs & Tech Accents subtly floating in background -->
  <g font-family="Space Mono, monospace" font-size="14" fill="#E8A65D" opacity="0.25">
    <text x="140" y="320">&lt;Frontend /&gt;</text>
    <text x="160" y="360">const solve = async () =&gt; {</text>
    <text x="190" y="390">await build(future);</text>
    <text x="160" y="420">};</text>
    <text x="620" y="620">&lt;Web3.deploy /&gt;</text>
    <text x="640" y="650">0x7133...5423</text>
  </g>
</svg>

