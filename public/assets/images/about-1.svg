<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#54230F"/>
      <stop offset="100%" stop-color="#2D1207"/>
    </linearGradient>
  </defs>
  <rect width="400" height="500" rx="24" fill="url(#cardGrad1)"/>
  <!-- Editor Window Header -->
  <rect x="20" y="20" width="360" height="36" rx="10" fill="#171310" opacity="0.6"/>
  <circle cx="42" cy="38" r="5" fill="#E8A65D"/>
  <circle cx="58" cy="38" r="5" fill="#C47A3E"/>
  <circle cx="74" cy="38" r="5" fill="#713315"/>
  <text x="100" y="42" font-family="Space Mono, monospace" font-size="11" fill="#FFF9EE" opacity="0.7">architecture.ts</text>

  <!-- Code lines -->
  <g font-family="Space Mono, monospace" font-size="13" fill="#FFF9EE">
    <text x="35" y="95" fill="#E8A65D">interface</text> <text x="125" y="95">DigitalProduct {</text>
    <text x="55" y="125" fill="#C47A3E">purpose:</text> <text x="135" y="125" fill="#FFF9EE">'meaningful';</text>
    <text x="55" y="155" fill="#C47A3E">architecture:</text> <text x="175" y="155" fill="#FFF9EE">'scalable';</text>
    <text x="55" y="185" fill="#C47A3E">precision:</text> <text x="150" y="185" fill="#E8A65D">1.0</text><text x="175" y="185">;</text>
    <text x="35" y="215">}</text>
    
    <text x="35" y="260" fill="#E8A65D">async function</text> <text x="160" y="260">build(</text>
    <text x="55" y="290">spec: DigitalProduct</text>
    <text x="35" y="320">): Promise&lt;Experience&gt; {</text>
    <text x="55" y="350" fill="#C47A3E">const</text> <text x="105" y="350">ui =</text> <text x="145" y="350" fill="#E8A65D">craftUI(spec);</text>
    <text x="55" y="380" fill="#C47A3E">return</text> <text x="115" y="380">ui.render();</text>
    <text x="35" y="410">}</text>
  </g>

  <!-- Accent glow bottom right -->
  <circle cx="340" cy="440" r="80" fill="#E8A65D" opacity="0.2"/>
  <text x="35" y="465" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="700" fill="#E8A65D" letter-spacing="1">CLEAN CODE ARCHITECTURE</text>
</svg>

