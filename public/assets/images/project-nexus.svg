<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <!-- Dark luxury Web3 gradient -->
    <linearGradient id="nexusBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1207"/>
      <stop offset="45%" stop-color="#1A0A04"/>
      <stop offset="100%" stop-color="#0E0502"/>
    </linearGradient>

    <!-- Amber Glow Gradient -->
    <radialGradient id="nexusGlow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#E8A65D" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#C47A3E" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#54230F" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8A65D" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#E8A65D" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#nexusBg)"/>
  <rect width="1200" height="750" fill="url(#nexusGlow)"/>

  <!-- Browser Frame Header -->
  <rect x="40" y="30" width="1120" height="48" rx="14" fill="#241108" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
  <circle cx="70" cy="54" r="6" fill="#E8A65D" opacity="0.8"/>
  <circle cx="90" cy="54" r="6" fill="#C47A3E" opacity="0.8"/>
  <circle cx="110" cy="54" r="6" fill="#713315" opacity="0.8"/>
  <!-- URL Bar -->
  <rect x="150" y="40" width="380" height="28" rx="8" fill="rgba(255, 255, 255, 0.05)"/>
  <text x="170" y="58" font-family="Space Mono, monospace" font-size="12" fill="#FFF9EE" opacity="0.6">https://nexus.protocol/app/staking</text>

  <!-- Wallet Pill -->
  <rect x="960" y="40" width="180" height="28" rx="14" fill="#C47A3E" opacity="0.25" stroke="#E8A65D" stroke-width="1"/>
  <circle cx="980" cy="54" r="4" fill="#22C55E"/>
  <text x="995" y="58" font-family="Space Mono, monospace" font-size="11" fill="#FFF9EE">0x71...542F (Mainnet)</text>

  <!-- App Dashboard Interior -->
  <!-- Top Stat Cards -->
  <g transform="translate(40, 105)">
    <!-- Stat 1 -->
    <rect x="0" y="0" width="265" height="110" rx="18" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    <text x="24" y="35" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="600" fill="#E8A65D">TOTAL VALUE LOCKED</text>
    <text x="24" y="75" font-family="Plus Jakarta Sans, sans-serif" font-size="28" font-weight="800" fill="#FFF9EE">$42,891,420</text>
    <text x="24" y="95" font-family="Plus Jakarta Sans, sans-serif" font-size="11" fill="#22C55E">▲ +14.2% (7d)</text>

    <!-- Stat 2 -->
    <rect x="285" y="0" width="265" height="110" rx="18" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    <text x="309" y="35" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="600" fill="#E8A65D">NET ANNUAL YIELD (APY)</text>
    <text x="309" y="75" font-family="Plus Jakarta Sans, sans-serif" font-size="28" font-weight="800" fill="#FFF9EE">18.64%</text>
    <text x="309" y="95" font-family="Plus Jakarta Sans, sans-serif" font-size="11" fill="#E8A65D">Compounded Hourly</text>

    <!-- Stat 3 -->
    <rect x="570" y="0" width="265" height="110" rx="18" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    <text x="594" y="35" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="600" fill="#E8A65D">MY STAKED BALANCE</text>
    <text x="594" y="75" font-family="Plus Jakarta Sans, sans-serif" font-size="28" font-weight="800" fill="#FFF9EE">14.85 ETH</text>
    <text x="594" y="95" font-family="Plus Jakarta Sans, sans-serif" font-size="11" fill="#FFF9EE" opacity="0.6">≈ $49,005.00 USD</text>

    <!-- Stat 4 -->
    <rect x="855" y="0" width="265" height="110" rx="18" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    <text x="879" y="35" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="600" fill="#E8A65D">UNCLAIMED REWARDS</text>
    <text x="879" y="75" font-family="Plus Jakarta Sans, sans-serif" font-size="28" font-weight="800" fill="#E8A65D">1.24 ETH</text>
    <rect x="879" y="85" width="85" height="20" rx="10" fill="#C47A3E"/>
    <text x="895" y="98" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="700" fill="#FFF9EE">CLAIM →</text>
  </g>

  <!-- Main Chart & Staking Form -->
  <!-- Left Side: Interactive Area Chart -->
  <g transform="translate(40, 240)">
    <rect x="0" y="0" width="715" height="460" rx="22" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.07)" stroke-width="1"/>
    <text x="30" y="45" font-family="Plus Jakarta Sans, sans-serif" font-size="18" font-weight="700" fill="#FFF9EE">Protocol Staking Telemetry &amp; Depth</text>
    <text x="30" y="68" font-family="Space Mono, monospace" font-size="11" fill="#E8A65D">30-Day Historical Return vs Benchmark</text>

    <!-- Chart Grid Lines -->
    <g stroke="rgba(255, 255, 255, 0.05)" stroke-width="1">
      <line x1="30" y1="120" x2="685" y2="120"/>
      <line x1="30" y1="200" x2="685" y2="200"/>
      <line x1="30" y1="280" x2="685" y2="280"/>
      <line x1="30" y1="360" x2="685" y2="360"/>
    </g>

    <!-- Spline Area -->
    <path d="M 30 380 Q 150 340, 220 290 T 360 270 T 480 180 T 580 160 T 685 110 L 685 410 L 30 410 Z" fill="url(#chartGrad)"/>
    <path d="M 30 380 Q 150 340, 220 290 T 360 270 T 480 180 T 580 160 T 685 110" fill="none" stroke="#E8A65D" stroke-width="3.5"/>
    <circle cx="685" cy="110" r="6" fill="#FFF9EE" stroke="#E8A65D" stroke-width="3"/>
  </g>

  <!-- Right Side: Stake Execution Card -->
  <g transform="translate(780, 240)">
    <rect x="0" y="0" width="380" height="460" rx="22" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(232, 166, 93, 0.25)" stroke-width="1.5"/>
    <text x="30" y="45" font-family="Plus Jakarta Sans, sans-serif" font-size="18" font-weight="700" fill="#FFF9EE">Stake Assets</text>
    <text x="30" y="70" font-family="Plus Jakarta Sans, sans-serif" font-size="12" fill="#E8A65D">Non-custodial smart contract deposit</text>

    <!-- Amount input box -->
    <rect x="30" y="100" width="320" height="70" rx="14" fill="rgba(0, 0, 0, 0.4)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
    <text x="48" y="142" font-family="Plus Jakarta Sans, sans-serif" font-size="24" font-weight="700" fill="#FFF9EE">10.00</text>
    <rect x="250" y="118" width="85" height="34" rx="10" fill="#54230F" stroke="#E8A65D" stroke-width="1"/>
    <circle cx="268" cy="135" r="7" fill="#E8A65D"/>
    <text x="282" y="140" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="700" fill="#FFF9EE">ETH</text>

    <!-- Sliders & options -->
    <rect x="30" y="195" width="320" height="8" rx="4" fill="rgba(255, 255, 255, 0.1)"/>
    <rect x="30" y="195" width="220" height="8" rx="4" fill="#C47A3E"/>
    <circle cx="250" cy="199" r="9" fill="#E8A65D"/>

    <!-- Fee line -->
    <text x="30" y="240" font-family="Space Mono, monospace" font-size="11" fill="#FFF9EE" opacity="0.6">Est. Gas:</text>
    <text x="310" y="240" font-family="Space Mono, monospace" font-size="11" fill="#22C55E">~$1.42 (0.0004 ETH)</text>
    <text x="30" y="270" font-family="Space Mono, monospace" font-size="11" fill="#FFF9EE" opacity="0.6">Slippage Tolerance:</text>
    <text x="325" y="270" font-family="Space Mono, monospace" font-size="11" fill="#FFF9EE">0.1%</text>

    <!-- Submit Button -->
    <rect x="30" y="320" width="320" height="52" rx="26" fill="#E8A65D"/>
    <text x="140" y="352" font-family="Plus Jakarta Sans, sans-serif" font-size="15" font-weight="800" fill="#3D1708">DEPOSIT &amp; STAKE →</text>

    <text x="60" y="405" font-family="Plus Jakarta Sans, sans-serif" font-size="11" fill="#FFF9EE" opacity="0.5">Audited by CertiK &amp; OpenZeppelin</text>
  </g>
</svg>

